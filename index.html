<!doctype html>
<html lang="en">

<head>
    <title>Naive 3D</title>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" type="text/css" href="./styles/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <div class="editor-layout">
        <header class="toolbar">
            <div id="editor-scene-name" style="font-weight: bold; margin-right: 20px;"></div>

            <div class="toolbar-tools">
                <button id="tool-move" class="tool-btn active" title="Move Tool (W)">
                    <span>󰆾</span> Move
                </button>
                <button id="tool-rotate" class="tool-btn" title="Rotate Tool (E)">
                    <span>󰑐</span> Rotate
                </button>
                <button id="tool-scale" class="tool-btn" title="Scale Tool (R)">
                    <span>󰆽</span> Scale
                </button>
            </div>

            <div style="flex: 1;"></div>

            <div class="dropdown">
                <button id="editor-btn-create" class="minimal-btn">
                    <span>󰐕</span> Create ▾
                </button>
                <div id="create-menu" class="dropdown-content">
                    <button class="menu-item" data-type="empty">Empty Object</button>
                    <button class="menu-item" data-type="sprite">Sprite</button>
                    <button class="menu-item" data-type="player">Player</button>
                </div>
            </div>
        </header>

        <aside class="panel hierarchy">
            <div class="panel-header">Hierarchy</div>
            <div id="editor-list-game-objects" class="panel-content"></div>
        </aside>

        <main class="viewport">
            <canvas id="canvas" width="720" height="640" class="naive3dCanvas"></canvas>
        </main>

        <aside class="panel inspector">
            <div class="panel-header">Inspector</div>
            <div id="editor-inspector-content" class="panel-content">
                <div class="inspector-empty-state">
                    Select an object to see its properties
                </div>
            </div>
        </aside>
    </div>
    <script type="module" src="src/main.ts"></script>
</body>

</html>
